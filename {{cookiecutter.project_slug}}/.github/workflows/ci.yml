name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  PYTHON_VERSION: "{{ cookiecutter.python_version }}"
  {% if cookiecutter.package_manager == "poetry" %}POETRY_VERSION: "1.8.0"{% endif %}

jobs:
  test:
    name: Test Suite
    runs-on: {% raw %}${{ matrix.os }}{% endraw %}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["{{ cookiecutter.python_version }}", "3.12", "3.11"]
        exclude:
          # Exclude some combinations to speed up CI
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python {% raw %}${{ matrix.python-version }}{% endraw %}
      uses: actions/setup-python@v5
      with:
        python-version: {% raw %}${{ matrix.python-version }}{% endraw %}

    {% if cookiecutter.package_manager == "uv" %}
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
    
    - name: Install dependencies
      run: |
        uv sync --all-extras --dev
    
    - name: Run tests
      run: |
        uv run pytest -xvs --cov={{ cookiecutter.__package_name }} --cov-report=xml
    {% elif cookiecutter.package_manager == "poetry" %}
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: {% raw %}${{ env.POETRY_VERSION }}{% endraw %}
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-{% raw %}${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}{% endraw %}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root {% if cookiecutter.include_notebooks %}--with notebook{% endif %}

    - name: Install project
      run: poetry install --no-interaction

    - name: Run tests
      run: |
        poetry run pytest -xvs --cov={{ cookiecutter.__package_name }} --cov-report=xml
    {% else %}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    
    - name: Run tests
      run: |
        pytest -xvs --cov={{ cookiecutter.__package_name }} --cov-report=xml
    {% endif %}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == env.PYTHON_VERSION
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: {% raw %}${{ env.PYTHON_VERSION }}{% endraw %}

    {% if cookiecutter.package_manager == "uv" %}
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
    
    - name: Install dependencies
      run: uv sync --dev
    
    {% if cookiecutter.linter == "ruff" %}
    - name: Run Ruff linter
      run: uv run ruff check .
    
    - name: Run Ruff formatter
      run: uv run ruff format --check .
    {% elif cookiecutter.linter == "pylint" %}
    - name: Run Pylint
      run: uv run pylint {{ cookiecutter.__package_name }}
    {% endif %}
    
    {% if cookiecutter.type_checker == "mypy" %}
    - name: Run MyPy
      run: uv run mypy {{ cookiecutter.__package_name }}
    {% elif cookiecutter.type_checker == "pyright" %}
    - name: Run Pyright
      run: uv run pyright {{ cookiecutter.__package_name }}
    {% endif %}
    
    {% if cookiecutter.include_security %}
    - name: Run Bandit security check
      run: uv run bandit -r {{ cookiecutter.__package_name }}
    
    - name: Run Safety check
      run: uv run safety check
    {% endif %}
    {% elif cookiecutter.package_manager == "poetry" %}
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: {% raw %}${{ env.POETRY_VERSION }}{% endraw %}

    - name: Install dependencies
      run: poetry install --no-interaction

    {% if cookiecutter.linter == "ruff" %}
    - name: Run Ruff linter
      run: poetry run ruff check .
    
    - name: Run Ruff formatter
      run: poetry run ruff format --check .
    {% elif cookiecutter.linter == "pylint" %}
    - name: Run Pylint
      run: poetry run pylint {{ cookiecutter.__package_name }}
    {% endif %}
    
    {% if cookiecutter.type_checker == "mypy" %}
    - name: Run MyPy
      run: poetry run mypy {{ cookiecutter.__package_name }}
    {% elif cookiecutter.type_checker == "pyright" %}
    - name: Run Pyright
      run: poetry run pyright {{ cookiecutter.__package_name }}
    {% endif %}
    
    {% if cookiecutter.include_security %}
    - name: Run Bandit security check
      run: poetry run bandit -r {{ cookiecutter.__package_name }}
    
    - name: Run Safety check
      run: poetry run safety check
    {% endif %}
    {% endif %}

  {% if cookiecutter.include_docs_site %}
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: {% raw %}${{ env.PYTHON_VERSION }}{% endraw %}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: docs/package-lock.json

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme myst-parser

    - name: Install Node.js dependencies
      run: |
        cd docs
        npm ci

    - name: Build documentation
      run: |
        cd docs
        npm run build

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}
        publish_dir: ./docs/build
  {% endif %}

  {% if cookiecutter.include_release_workflow %}
  release:
    name: Release
    needs: [test, quality{% if cookiecutter.include_docs_site %}, docs{% endif %}]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: {% raw %}${{ env.PYTHON_VERSION }}{% endraw %}

    {% if cookiecutter.package_manager == "poetry" %}
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: {% raw %}${{ env.POETRY_VERSION }}{% endraw %}

    - name: Build package
      run: poetry build

    - name: Publish to PyPI
      env:
        POETRY_PYPI_TOKEN_PYPI: {% raw %}${{ secrets.PYPI_TOKEN }}{% endraw %}
      run: poetry publish
    {% else %}
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: {% raw %}${{ secrets.PYPI_TOKEN }}{% endraw %}
      run: twine upload dist/*
    {% endif %}

    {% if cookiecutter.include_docker %}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: {% raw %}${{ secrets.DOCKER_USERNAME }}{% endraw %}
        password: {% raw %}${{ secrets.DOCKER_PASSWORD }}{% endraw %}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          {{ cookiecutter.github }}/{{ cookiecutter.project_slug }}:latest
          {{ cookiecutter.github }}/{{ cookiecutter.project_slug }}:{% raw %}${{ github.event.release.tag_name }}{% endraw %}
        platforms: linux/amd64,linux/arm64
    {% endif %}
  {% endif %}

  {% if cookiecutter.include_api %}
  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    services:
      {% if cookiecutter.include_database and cookiecutter.database_type == "postgresql" %}
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      {% elif cookiecutter.include_database and cookiecutter.database_type == "mysql" %}
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
      {% endif %}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: {% raw %}${{ env.PYTHON_VERSION }}{% endraw %}

    {% if cookiecutter.package_manager == "uv" %}
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
    
    - name: Install dependencies
      run: uv sync --dev
    
    - name: Run API tests
      run: uv run pytest tests/test_api.py -v
      env:
        {% if cookiecutter.include_database and cookiecutter.database_type == "postgresql" %}
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        {% elif cookiecutter.include_database and cookiecutter.database_type == "mysql" %}
        DATABASE_URL: mysql://root:root@localhost:3306/test_db
        {% endif %}
    {% elif cookiecutter.package_manager == "poetry" %}
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: {% raw %}${{ env.POETRY_VERSION }}{% endraw %}

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Run API tests
      run: poetry run pytest tests/test_api.py -v
      env:
        {% if cookiecutter.include_database and cookiecutter.database_type == "postgresql" %}
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        {% elif cookiecutter.include_database and cookiecutter.database_type == "mysql" %}
        DATABASE_URL: mysql://root:root@localhost:3306/test_db
        {% endif %}
    {% endif %}
  {% endif %}